 <aside
        class="fixed flex flex-col top-0 px-5 left-0 bg-white dark:bg-gray-900 dark:border-gray-800 text-gray-900 h-screen transition-all duration-300 ease-in-out z-50 border-r border-gray-200 w-[290px] -translate-x-full xl:translate-x-0">
        <a class="flex items-center gap-2 mt-10" href="#hero">

                <li>

                                class="flex h-9 w-9 items-center justify-center rounded-xl border border-brand/20 text-brand dark:border-white/15 dark:text-brand2">
                                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.7">
                                    <path d="M6 6h15l-1.5 9h-11L6 6z"></path>
                                    <path d="M6 6l-2-2"></path>
                                    <circle cx="9" cy="19" r="1.6"></circle>

                                </svg>
                            </span>
                            Tasks
                            <!-- <span class="ml-auto inline-flex items-center rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-semibold text-emerald-700 dark:bg-emerald-400/20 dark:text-emerald-200">NEW</span> -->
                            <svg class="ml-2 h-4 w-4 text-brand transition group-open:rotate-180 dark:text-brand2"

                                <path d="M6 8l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </summary>

                            <li><a class="block rounded-lg px-3 py-2 font-medium hover:bg-gray-50 dark:hover:bg-white/5"

                            <li><a class="block rounded-lg px-3 py-2 font-medium hover:bg-gray-50 dark:hover:bg-white/5"
                                    [routerLink] ="['/admin', 'new-task']">Add Task</a></li>

                        </ul>
                    </details>
                </li>
            </ul>

            <div class="mt-8 text-xs font-semibold uppercase tracking-[0.2em] text-gray-400 dark:text-gray-500">Support

            <ul class="mt-4 space-y-1">

                        <span
                            class="flex h-9 w-9 items-center justify-center rounded-xl border border-gray-200 text-gray-500 dark:border-gray-800 dark:text-gray-400">
                            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"

                                <path d="M7 8h7a5 5 0 010 10H9l-5 3v-3a6 6 0 013-10z"></path>
